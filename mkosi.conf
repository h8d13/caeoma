[Distribution]
Distribution=arch

[Output]
ImageId=caeoma
# Disk format only to get the erofs /usr and the ESP as split partition
# files (mkosi.repart/); mkosi.postoutput assembles the installed disk.
Format=disk
SplitArtifacts=partitions
OutputDirectory=mkosi.output

[Content]
# Boot artifacts (initrd, UKI, sd-boot) come from scripts/postinst.
Bootable=no
# scripts/ is the glue shared by this build and in-box caeoma-update
# (mkosi.extra/ is picked up by default).
ExtraTrees=scripts:/usr/lib/caeoma
Packages=
	base
	pacman
	linux
	mkinitcpio
	systemd
	systemd-ukify
	btrfs-progs
	erofs-utils
	dosfstools

[Build]
# mkfs.erofs, mtools, systemd-repart, qemu come from here, not the host.
ToolsTree=yes

[Runtime]
Firmware=uefi
RuntimeSize=16G
# Dev-only first boot answers for `mkosi vm`; not baked into the image.
Credentials=passwd.plaintext-password.root=root
	firstboot.locale=C.UTF-8
	firstboot.keymap=us
	firstboot.timezone=UTC
