[Distribution]
Distribution=arch

[Output]
ImageId=caeoma
# Disk format only to get the erofs /usr and the ESP as split partition
# files (mkosi.repart/); mkosi.postoutput assembles the installed disk.
Format=disk
SplitArtifacts=partitions
OutputDirectory=mkosi.output

[Content]
# Boot artifacts (initrd, UKI, sd-boot) come from scripts/postinst.
# tree/ and scripts/ (the glue shared with the in-box update) are installed
# by mkosi.postinst.chroot, rendered for ImageId= (scripts/render).
# mkosi.skeleton/ masks mkinitcpio's pacman hook before packages install;
# the image's /etc keeps it for in-box updates.
Bootable=no
# Deliberatly off since we own how the bootloader behaves.
# base brings pacman and systemd.
Packages=
	base
	linux
	mkinitcpio
	systemd-ukify
	btrfs-progs
	erofs-utils
	dosfstools

[Build]
# mkfs.erofs, mtools, systemd-repart, qemu come from here, not the host.
ToolsTree=yes
# The base erofs as the update builds its full images: 48bit lets deltas
# move the root inode (see scripts/update build_full).
Environment=SYSTEMD_REPART_MKFS_OPTIONS_EROFS=-E48bit

[Runtime]
Firmware=uefi
RuntimeSize=16G
# First boot settings and the root password are the image's own
# (tree/usr/lib/credstore), applied without prompting, on any machine.
