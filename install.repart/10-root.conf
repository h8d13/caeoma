# Stage 2 (mkosi.postoutput): installable disk. btrfs top level is mounted
# at /system (versioned erofs files from stage 1 live there), @system is /.

[Partition]
Type=root
Format=btrfs
CopyFiles=/root:/
Subvolumes=/@system
SizeMinBytes=4G
# Grow the fs after usr/lib/repart.d grows the partition on first boot.
GrowFileSystem=yes
