# Stage 2 (mkosi.postoutput): installable disk. btrfs top level is mounted
# at /system (versioned erofs files from stage 1 live there), @system is /,
# @home is /home, @var is /var, @etc the /etc overlay upper: one pool, so
# none has a size to outgrow.

[Partition]
Type=root
Format=btrfs
CopyFiles=/root:/
Subvolumes=/@system /@home /@var /@etc
SizeMinBytes=4G
# No grow-file-system flag (mkosi.postoutput clears it, repart sets it
# regardless of GrowFileSystem=no): the initrd grows partition and btrfs
# itself (the usr generator), systemd-growfs cannot resize an opened LUKS2
# root.
