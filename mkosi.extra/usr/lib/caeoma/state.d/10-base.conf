# Image state rules, see /usr/lib/caeoma/state. Local additions go to
# /etc/caeoma/state.d/*.conf (same name replaces a file here).

# pacman's installed-package DB describes the image: ships in /usr.
carry /var/lib/pacman/local

# The image's /var is never mounted (/var comes from @system); its repo
# indexes, logs and caches are only build/update leftovers.
drop /var/*
