# Writable /usr for trying things (pacman -S on the box); writes go to an
# empty ephemeral upper and are gone at unmerge/reboot. Permanent changes
# go through caeoma-update. sysext only merges with an extension present:
# an empty one in /run (caeoma-sysext.conf, caeoma-sysext-anchor.service).
[SysExt]
Mutable=ephemeral
