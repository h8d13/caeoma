# Empty extension: systemd-sysext merges (here: the ephemeral writable /usr)
# only with an extension present. In /run, not inside /usr: an extension
# below the hierarchy it is merged into overlaps it, which overlayfs
# refuses. Created before sysext by caeoma-sysext-anchor.service.
f /run/extensions/caeoma-ephemeral/usr/lib/extension-release.d/extension-release.caeoma-ephemeral 0644 - - - ID=_any
