# Writable /usr for trying things (pacman -S on the box); writes go to an
# empty ephemeral upper and are gone at unmerge/reboot. Permanent changes
# go through the update command. sysext only merges with an extension
# present: an empty one in /run (the sysext tmpfiles entry and anchor
# service).
[SysExt]
Mutable=ephemeral
