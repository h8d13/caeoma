# Writable /usr (pacman -S, make install, edits on the box): writes go to
# the upper of the running image version, /var/lib/__NAME__/usr/<version>
# (the sysext tmpfiles entry points /var/lib/extensions.mutable/usr at
# it). They persist across reboots and stay with their version: a new
# version starts clean, booting an old one finds its own again. sysext
# only merges with an extension present: an empty one in /run (the sysext
# tmpfiles entry and anchor service).
[SysExt]
Mutable=yes
