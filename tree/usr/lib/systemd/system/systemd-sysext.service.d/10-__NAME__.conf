# Only /usr: /opt stays a plain persistent directory. Mount options are
# sysext's own but redirect_dir=off: a renamed dir is copied up whole
# instead of pointing at its lower name, so the upper holds every change
# by itself. A manual `systemd-sysext refresh` needs the same variables.
[Service]
Environment=SYSTEMD_SYSEXT_HIERARCHIES=/usr
Environment=SYSTEMD_SYSEXT_OVERLAYFS_MOUNT_OPTIONS=redirect_dir=off,noatime,metacopy=off,index=off
