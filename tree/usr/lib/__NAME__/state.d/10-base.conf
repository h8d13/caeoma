# Image state rules, see /usr/lib/__NAME__/state. Local additions go to
# /etc/__NAME__/state.d/*.conf (same name replaces a file here).

# pacman's installed-package DB describes the image: ships in /usr.
carry /var/lib/pacman/local

# The image's /var is never mounted (/var is @var); its repo
# indexes, logs and caches are only build/update leftovers.
drop /var/*

# Made on the box (sysusers, firstboot, ldconfig, resolved, key and
# secret generation) or in the build only (resolv.conf is a bind there,
# the keyring holds its private key, pam.d moves to /usr/lib).
machine /etc/.pwd.lock
machine /etc/passwd*
machine /etc/shadow*
machine /etc/group*
machine /etc/gshadow*
machine /etc/subuid*
machine /etc/subgid*
machine /etc/machine-id
machine /etc/machine-info
machine /etc/hostname
machine /etc/localtime
machine /etc/locale.conf
machine /etc/vconsole.conf
machine /etc/adjtime
machine /etc/crypttab
machine /etc/resolv.conf
machine /etc/ld.so.cache
machine /etc/.updated
machine /etc/pam.d
machine /etc/pacman.d/gnupg
machine /etc/ssh/ssh_host_*
machine /etc/NetworkManager/system-connections
# The box's own config (local state.d, glue URL).
machine /etc/__NAME__
