# Empty extension: systemd-sysext merges (here: the writable /usr) only
# with an extension present. In /run, not inside /usr: an extension below
# the hierarchy it is merged into overlaps it, which overlayfs refuses.
# Then the upper of the running version (%A: IMAGE_VERSION), where sysext
# routes /usr writes. Created before sysext by the anchor service.
f /run/extensions/__NAME__-anchor/usr/lib/extension-release.d/extension-release.__NAME__-anchor 0644 - - - ID=_any
d /var/lib/__NAME__/usr/%A 0755 root root -
L+ /var/lib/extensions.mutable/usr - - - - /var/lib/__NAME__/usr/%A
