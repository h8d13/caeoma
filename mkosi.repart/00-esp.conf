# Stage 1 (mkosi build): factory ESP as a split partition file, esp.raw.
# sd-boot + this build's UKI; install.repart copies it block-wise. Sized for
# several UKIs side by side: the update keeps the newest few versions, two
# UKIs each (host-only and fallback), with microcode.

[Partition]
Type=esp
Format=vfat
CopyFiles=/usr/share/factory/boot:/
SizeMinBytes=2G
SizeMaxBytes=2G
