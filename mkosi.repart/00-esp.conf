# Stage 1 (mkosi build): factory ESP as a split partition file, esp.raw.
# sd-boot + this build's UKI; install.repart copies it block-wise. Sized for
# several UKIs side by side (caeoma-update keeps the newest few).

[Partition]
Type=esp
Format=vfat
CopyFiles=/usr/share/factory/boot:/
SizeMinBytes=1G
SizeMaxBytes=1G
