# Stage 1 (mkosi build): the whole tree as erofs, kept as <id>_<ver>.erofs.
# Only its /usr is mounted at boot (X-mount.subdir), which is fine: /etc
# comes from usr/share/factory/etc, /var is created.

[Partition]
Type=root
Format=erofs
CopyFiles=/
# The factory ESP's UKI only seeds esp.raw (00-esp.conf); in the image it
# would be ~70M nobody mounts, whited out by the first update. /var stays
# empty as the vendor "drop /var/*" rule has it: finalize leaves mkosi's
# scratch mount on /var/tmp, which only a contents exclusion catches.
ExcludeFiles=/usr/share/factory/boot/EFI/Linux/ /var/
Compression=zstd
Minimize=best
